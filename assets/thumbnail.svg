<svg width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bgGradient)"/>

  <!-- Decorative Elements -->
  <circle cx="1100" cy="100" r="150" fill="#3b82f6" opacity="0.1"/>
  <circle cx="200" cy="600" r="200" fill="#8b5cf6" opacity="0.1"/>

  <!-- Left Side: Code Icon -->
  <g transform="translate(150, 200)">
    <!-- Bracket Left -->
    <path d="M 20 0 L 0 0 L 0 200 L 20 200" stroke="#3b82f6" stroke-width="4" fill="none" stroke-linecap="round"/>
    
    <!-- Code Lines -->
    <line x1="30" y1="40" x2="120" y2="40" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
    <line x1="30" y1="80" x2="140" y2="80" stroke="#60a5fa" stroke-width="3" stroke-linecap="round"/>
    <line x1="30" y1="120" x2="110" y2="120" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
    <line x1="30" y1="160" x2="125" y2="160" stroke="#60a5fa" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Bracket Right -->
    <path d="M 120 0 L 140 0 L 140 200 L 120 200" stroke="#8b5cf6" stroke-width="4" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Right Side: Arrow & Translation -->
  <g transform="translate(600, 280)">
    <!-- Arrow -->
    <line x1="0" y1="40" x2="80" y2="40" stroke="url(#accentGradient)" stroke-width="5" stroke-linecap="round"/>
    <polygon points="80,40 65,30 70,40 65,50" fill="url(#accentGradient)"/>
    
    <!-- Translation Icon -->
    <text x="100" y="55" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#60a5fa">
      TRANSLATE
    </text>
  </g>

  <!-- Center: Language Icons -->
  <g transform="translate(300, 400)">
    <!-- Java -->
    <circle cx="0" cy="0" r="30" fill="#f59e0b" opacity="0.2"/>
    <text x="-8" y="12" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#f59e0b">J</text>
    
    <!-- Python -->
    <circle cx="120" cy="0" r="30" fill="#3776ab" opacity="0.2"/>
    <text x="112" y="12" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#3776ab">P</text>
    
    <!-- C++ -->
    <circle cx="240" cy="0" r="30" fill="#00599c" opacity="0.2"/>
    <text x="230" y="12" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#00599c">C++</text>
  </g>

  <!-- Main Title -->
  <text x="640" y="100" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="white" text-anchor="middle">
    Syn2Sem
  </text>

  <!-- Subtitle -->
  <text x="640" y="160" font-family="Arial, sans-serif" font-size="28" fill="#94a3b8" text-anchor="middle">
    AI-Powered Code Translation
  </text>

  <!-- Features Line -->
  <text x="640" y="630" font-family="Arial, sans-serif" font-size="18" fill="#64748b" text-anchor="middle">
    Java • C • C++ • Python • JavaScript — Smart Translation, Instant Validation
  </text>

  <!-- Accent Line -->
  <line x1="200" y1="680" x2="1080" y2="680" stroke="url(#accentGradient)" stroke-width="3"/>
</svg>